<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#312e81"/>
      <stop offset="50%"  stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Skin gradient -->
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#fde8d0"/>
      <stop offset="100%" stop-color="#f5c9a0"/>
    </linearGradient>

    <!-- Skin shade -->
    <linearGradient id="skinShade" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%"  stop-color="#f5c9a0"/>
      <stop offset="100%" stop-color="#e8a87c"/>
    </linearGradient>

    <!-- Hair gradient -->
    <linearGradient id="hair" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%"  stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#0d0a04"/>
    </linearGradient>

    <!-- Shirt gradient -->
    <linearGradient id="shirt" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%"  stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>

    <!-- Collar gradient -->
    <linearGradient id="collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Glow -->
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%"  stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Ambient ring -->
    <radialGradient id="ring" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.35"/>
    </radialGradient>

    <!-- Noise filter for texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- Soft shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>

    <!-- Inner glow filter -->
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <clipPath id="circleClip">
      <circle cx="200" cy="200" r="192"/>
    </clipPath>
  </defs>

  <!-- ── Base circle ── -->
  <circle cx="200" cy="200" r="200" fill="url(#bg)"/>

  <!-- Glow overlay -->
  <circle cx="200" cy="200" r="200" fill="url(#glow)"/>

  <!-- Subtle grid dots pattern -->
  <g clip-path="url(#circleClip)" opacity="0.04">
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#a5b4fc"/>
    </pattern>
    <rect width="400" height="400" fill="url(#dots)"/>
  </g>

  <!-- ── Decorative ring ── -->
  <circle cx="200" cy="200" r="190" stroke="#6366f1" stroke-width="0.5" stroke-dasharray="4 8" opacity="0.4"/>
  <circle cx="200" cy="200" r="175" stroke="#8b5cf6" stroke-width="0.25" opacity="0.2"/>

  <!-- ── Floating orbs (background depth) ── -->
  <circle cx="60"  cy="80"  r="28" fill="#4f46e5" opacity="0.12"/>
  <circle cx="340" cy="100" r="18" fill="#8b5cf6" opacity="0.15"/>
  <circle cx="50"  cy="320" r="14" fill="#06b6d4" opacity="0.10"/>
  <circle cx="350" cy="300" r="22" fill="#6366f1" opacity="0.08"/>

  <!-- ── Shoulders / shirt ── -->
  <!-- Main shirt body -->
  <path
    d="M 60 400 
       Q 62 330 80 305
       Q 110 280 145 270
       L 155 295
       Q 200 310 245 295
       L 255 270
       Q 290 280 320 305
       Q 338 330 340 400 Z"
    fill="url(#shirt)"
    filter="url(#softShadow)"
  />

  <!-- Shirt highlight -->
  <path
    d="M 80 305 Q 110 280 145 270 L 148 278 Q 118 290 92 314 Z"
    fill="#ffffff" opacity="0.08"
  />

  <!-- ── Collar / white shirt underneath ── -->
  <path
    d="M 155 295 Q 175 315 200 318 Q 225 315 245 295
       L 240 275 Q 220 292 200 296 Q 180 292 160 275 Z"
    fill="url(#collar)"
    opacity="0.95"
  />

  <!-- Collar fold shadow -->
  <path
    d="M 165 276 Q 182 294 200 297 Q 218 294 235 276"
    stroke="#cbd5e1" stroke-width="1" fill="none" opacity="0.5"
  />

  <!-- ── Neck ── -->
  <path
    d="M 178 245 Q 177 268 178 278 
       Q 190 288 200 289 Q 210 288 222 278 
       Q 223 268 222 245 Z"
    fill="url(#skinShade)"
  />

  <!-- Neck shadow sides -->
  <path d="M 178 250 Q 177 268 179 278 Q 185 270 185 255 Z" fill="#d4956a" opacity="0.3"/>
  <path d="M 222 250 Q 223 268 221 278 Q 215 270 215 255 Z" fill="#d4956a" opacity="0.3"/>

  <!-- ── Ears ── -->
  <!-- Left ear -->
  <ellipse cx="134" cy="192" rx="10" ry="14" fill="url(#skin)"/>
  <ellipse cx="136" cy="192" rx="6"  ry="9"  fill="#e8a87c" opacity="0.6"/>
  <path d="M 134 184 Q 130 192 134 200" stroke="#d4956a" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- Right ear -->
  <ellipse cx="266" cy="192" rx="10" ry="14" fill="url(#skin)"/>
  <ellipse cx="264" cy="192" rx="6"  ry="9"  fill="#e8a87c" opacity="0.6"/>
  <path d="M 266 184 Q 270 192 266 200" stroke="#d4956a" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- ── Head ── -->
  <ellipse
    cx="200" cy="178" rx="68" ry="75"
    fill="url(#skin)"
    filter="url(#softShadow)"
  />

  <!-- Head side shadows (give depth) -->
  <ellipse cx="148" cy="188" rx="20" ry="40" fill="#e8a87c" opacity="0.25"/>
  <ellipse cx="252" cy="188" rx="20" ry="40" fill="#c8895a" opacity="0.12"/>

  <!-- Forehead highlight -->
  <ellipse cx="195" cy="148" rx="28" ry="18" fill="#fdf0e3" opacity="0.35"/>

  <!-- ── Hair ── -->
  <!-- Back/crown layer -->
  <path
    d="M 140 155 
       Q 138 115 162 100 
       Q 180 88  200 86 
       Q 220 88  238 100 
       Q 262 115 260 155
       Q 245 130 200 128
       Q 155 130 140 155 Z"
    fill="url(#hair)"
  />

  <!-- Top hair with natural flow -->
  <path
    d="M 142 158 
       Q 144 120 168 104 
       Q 182 94  200 92 
       Q 218 94  232 104 
       Q 256 120 258 158
       Q 248 138 228 132
       Q 215 128 200 127
       Q 185 128 172 132
       Q 152 138 142 158 Z"
    fill="#231a0e"
  />

  <!-- Hair highlight -->
  <path
    d="M 180 93 Q 200 88 218 94 Q 205 91 200 90 Q 195 90 180 93 Z"
    fill="#4a3520" opacity="0.7"
  />

  <!-- Hair texture strands -->
  <path d="M 165 108 Q 175 118 178 132" stroke="#0d0a04" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M 182 97  Q 185 112 186 128" stroke="#0d0a04" stroke-width="1"   fill="none" opacity="0.4"/>
  <path d="M 200 93  Q 200 110 200 127" stroke="#0d0a04" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M 218 97  Q 215 112 214 128" stroke="#0d0a04" stroke-width="1"   fill="none" opacity="0.4"/>
  <path d="M 235 108 Q 225 118 222 132" stroke="#0d0a04" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Sideburns -->
  <path
    d="M 142 158 Q 136 172 136 185 Q 138 195 143 200 Q 140 178 146 162 Z"
    fill="#1a1208" opacity="0.9"
  />
  <path
    d="M 258 158 Q 264 172 264 185 Q 262 195 257 200 Q 260 178 254 162 Z"
    fill="#1a1208" opacity="0.9"
  />

  <!-- ── Eyebrows ── -->
  <!-- Left eyebrow -->
  <path
    d="M 158 158 Q 170 152 184 155"
    stroke="#1a1208" stroke-width="3.5" stroke-linecap="round" fill="none"
  />
  <path
    d="M 159 159 Q 171 153 183 156"
    stroke="#2d2010" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"
  />

  <!-- Right eyebrow -->
  <path
    d="M 216 155 Q 230 152 242 158"
    stroke="#1a1208" stroke-width="3.5" stroke-linecap="round" fill="none"
  />
  <path
    d="M 217 156 Q 231 153 241 159"
    stroke="#2d2010" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"
  />

  <!-- ── Eyes ── -->
  <!-- Left eye socket shadow -->
  <ellipse cx="171" cy="175" rx="16" ry="11" fill="#d4956a" opacity="0.15"/>

  <!-- Left eye white -->
  <ellipse cx="171" cy="175" rx="14" ry="10" fill="#fefefe"/>
  <!-- Left iris -->
  <circle cx="171" cy="175" r="7" fill="#3d2b1a"/>
  <!-- Left pupil -->
  <circle cx="171" cy="175" r="4" fill="#0d0a04"/>
  <!-- Left iris ring -->
  <circle cx="171" cy="175" r="7" stroke="#6b4423" stroke-width="0.5" fill="none" opacity="0.6"/>
  <!-- Left catch-light -->
  <circle cx="174" cy="172" r="2.2" fill="white" opacity="0.9"/>
  <circle cx="169" cy="178" r="1"   fill="white" opacity="0.4"/>
  <!-- Left eyelid crease -->
  <path d="M 157 170 Q 171 165 185 170" stroke="#c4845a" stroke-width="1" fill="none" opacity="0.35"/>
  <!-- Left lashes top -->
  <path d="M 157 171 Q 171 166 185 171" stroke="#1a1208" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Left lashes bottom -->
  <path d="M 158 180 Q 171 183 184 180" stroke="#1a1208" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Right eye socket shadow -->
  <ellipse cx="229" cy="175" rx="16" ry="11" fill="#d4956a" opacity="0.15"/>

  <!-- Right eye white -->
  <ellipse cx="229" cy="175" rx="14" ry="10" fill="#fefefe"/>
  <!-- Right iris -->
  <circle cx="229" cy="175" r="7" fill="#3d2b1a"/>
  <!-- Right pupil -->
  <circle cx="229" cy="175" r="4" fill="#0d0a04"/>
  <!-- Right iris ring -->
  <circle cx="229" cy="175" r="7" stroke="#6b4423" stroke-width="0.5" fill="none" opacity="0.6"/>
  <!-- Right catch-light -->
  <circle cx="232" cy="172" r="2.2" fill="white" opacity="0.9"/>
  <circle cx="227" cy="178" r="1"   fill="white" opacity="0.4"/>
  <!-- Right eyelid crease -->
  <path d="M 215 170 Q 229 165 243 170" stroke="#c4845a" stroke-width="1" fill="none" opacity="0.35"/>
  <!-- Right lashes top -->
  <path d="M 215 171 Q 229 166 243 171" stroke="#1a1208" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Right lashes bottom -->
  <path d="M 216 180 Q 229 183 242 180" stroke="#1a1208" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- ── Nose ── -->
  <!-- Bridge -->
  <path
    d="M 200 183 Q 197 198 193 210 Q 196 216 200 217 Q 204 216 207 210 Q 203 198 200 183"
    fill="#e8a87c" opacity="0.5"
  />
  <!-- Nostrils -->
  <ellipse cx="193" cy="214" rx="5.5" ry="4" fill="#c8895a" opacity="0.55"/>
  <ellipse cx="207" cy="214" rx="5.5" ry="4" fill="#c8895a" opacity="0.55"/>
  <!-- Nose tip highlight -->
  <ellipse cx="200" cy="213" rx="4" ry="2.5" fill="#fde8d0" opacity="0.4"/>
  <!-- Nose shadow under -->
  <path d="M 188 216 Q 200 220 212 216" stroke="#c07545" stroke-width="1" fill="none" opacity="0.35"/>

  <!-- ── Mouth / lips ── -->
  <!-- Upper lip -->
  <path
    d="M 184 229 
       Q 190 225 196 227 Q 200 224 204 227 Q 210 225 216 229
       Q 210 234 200 234 Q 190 234 184 229 Z"
    fill="#c8785a"
  />
  <!-- Philtrum dip -->
  <path d="M 196 228 Q 200 225 204 228" stroke="#b56a4c" stroke-width="0.8" fill="none"/>

  <!-- Lower lip -->
  <path
    d="M 184 229 Q 190 234 200 236 Q 210 234 216 229
       Q 210 242 200 243 Q 190 242 184 229 Z"
    fill="#d4895e"
  />
  <!-- Lip highlight -->
  <ellipse cx="200" cy="237" rx="8" ry="2.5" fill="#e8a87c" opacity="0.35"/>
  <!-- Mouth line -->
  <path d="M 184 229 Q 200 231 216 229" stroke="#b05a3a" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- Subtle smile -->
  <path
    d="M 186 229 Q 193 234 200 235 Q 207 234 214 229"
    stroke="#a04a2a" stroke-width="0.5" fill="none" opacity="0.3"
  />

  <!-- ── Chin & jaw highlight ── -->
  <ellipse cx="200" cy="238" rx="12" ry="5" fill="#fde8d0" opacity="0.2"/>

  <!-- ── Subtle cheek blush ── -->
  <ellipse cx="152" cy="198" rx="18" ry="10" fill="#f0826c" opacity="0.08"/>
  <ellipse cx="248" cy="198" rx="18" ry="10" fill="#f0826c" opacity="0.08"/>

  <!-- ── Glasses (thin wire frame) ── -->
  <!-- Left lens frame -->
  <rect x="152" y="165" width="38" height="26" rx="9" ry="9"
    stroke="#a5b4fc" stroke-width="1.8" fill="none" opacity="0.7"/>
  <!-- Right lens frame -->
  <rect x="210" y="165" width="38" height="26" rx="9" ry="9"
    stroke="#a5b4fc" stroke-width="1.8" fill="none" opacity="0.7"/>
  <!-- Bridge piece -->
  <path d="M 190 177 Q 200 174 210 177" stroke="#a5b4fc" stroke-width="1.8" fill="none" opacity="0.7"/>
  <!-- Left temple arm -->
  <path d="M 152 173 Q 140 171 136 178" stroke="#a5b4fc" stroke-width="1.5" fill="none" opacity="0.6"/>
  <!-- Right temple arm -->
  <path d="M 248 173 Q 260 171 264 178" stroke="#a5b4fc" stroke-width="1.5" fill="none" opacity="0.6"/>
  <!-- Lens glint left -->
  <path d="M 158 170 Q 163 168 168 170" stroke="white" stroke-width="1" fill="none" opacity="0.25"/>
  <!-- Lens glint right -->
  <path d="M 216 170 Q 221 168 226 170" stroke="white" stroke-width="1" fill="none" opacity="0.25"/>

  <!-- ── Outer ambient ring ── -->
  <circle cx="200" cy="200" r="198" fill="url(#ring)"/>

  <!-- ── Bottom gradient fade (merges into card) ── -->
  <defs>
    <linearGradient id="bottomFade" x1="0" y1="0.6" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="200" r="200" fill="url(#bottomFade)"/>
</svg>
